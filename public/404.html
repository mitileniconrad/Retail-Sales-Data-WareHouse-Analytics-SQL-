<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --ink: #000000;
      --muted: #555555;
      --line: #000000;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --ink: #ffffff;
        --muted: #aaaaaa;
        --line: #ffffff;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main { width: 100%; max-width: 520px; text-align: center; }

    .code {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(4px, 2vw, 14px);
      font-size: clamp(88px, 26vw, 168px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
    }
    .ring {
      width: 0.78em;
      height: 0.78em;
      border: 0.13em solid var(--ink);
      border-radius: 50%;
    }

    h1 { font-size: clamp(24px, 6vw, 32px); font-weight: 800; margin: 28px 0 10px; letter-spacing: -0.01em; }
    p { color: var(--muted); font-size: 16px; line-height: 1.6; margin: 0 auto; max-width: 42ch; }
    .path {
      display: inline-block;
      margin: 18px 0 0;
      padding: 8px 14px;
      max-width: 100%;
      overflow-wrap: anywhere;
      border: 1px solid var(--line);
      border-radius: 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
    }
    .path[hidden] { display: none; }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 32px; }
    .btn {
      font: inherit;
      font-weight: 600;
      font-size: 15px;
      padding: 14px 24px;
      border-radius: 6px;
      border: 2px solid var(--ink);
      text-decoration: none;
      cursor: pointer;
    }
    .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
    .primary { background: var(--ink); color: var(--bg); }
    .primary:hover { background: var(--bg); color: var(--ink); }
    .secondary { background: var(--bg); color: var(--ink); }
    .secondary:hover { background: var(--ink); color: var(--bg); }
  </style>
</head>
<body>
  <main>
    <div class="code" aria-hidden="true">4<span class="ring"></span>4</div>
    <h1>We can’t find that page</h1>
    <p>The link may be broken, or the page may have been moved or removed. Check the address for typos, or head back to somewhere safe.</p>

    <div class="actions">
      <a class="btn primary" href="/">Go to homepage</a>
      <button class="btn secondary" type="button" onclick="history.length > 1 ? history.back() : (location.href = '/')">Go back</button>
    </div>
  </main>
  <script>
    (function () {
      var el = document.getElementById('path');
      var real = /^https?:$/.test(location.protocol) && location.pathname !== 'srcdoc';
      if (el && real && location.pathname && location.pathname !== '/') {
        el.textContent = location.pathname;
        el.hidden = false;
      }
    })();
  </script>
</body>
</html>
